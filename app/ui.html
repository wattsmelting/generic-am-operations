<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generic AM Operations 0.4</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;--bg:#f4f6f9;--panel:#fff;--ink:#19283a;--muted:#637287;--line:#dce2eb;--accent:#1f668b;--nav:#14293d;--navink:#dbe8f1}[data-theme=dark]{color-scheme:dark;--bg:#101924;--panel:#192637;--ink:#e9f1fa;--muted:#a9b8c9;--line:#354457;--accent:#5fb6dc;--nav:#0a111b;--navink:#e1eaf4}[data-theme=slate]{--bg:#e6e9eb;--panel:#f8f9fa;--ink:#28333b;--muted:#596872;--line:#cdd5d9;--accent:#4b6f79;--nav:#34454e;--navink:#edf2f4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}.shell{display:flex;min-height:100vh}.sidebar{width:245px;flex:none;background:var(--nav);color:var(--navink);padding:20px 10px;max-height:100vh;overflow:auto;position:sticky;top:0}.brand{padding:8px 10px 18px;font-size:18px;font-weight:750}.brand small{display:block;font-size:11px;font-weight:400;opacity:.75}.nav{width:100%;text-align:left;border:0;background:none;color:inherit;padding:9px 12px;border-radius:7px;cursor:pointer;font:inherit;margin:1px 0}.nav:hover,.nav.active{background:#ffffff24}.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--panel);border-bottom:1px solid var(--line);padding:18px 25px}.top h1{margin:0;font-size:23px}.content{padding:24px;max-width:1450px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:19px;margin-bottom:15px}.note{border-left:4px solid var(--accent);padding:12px 16px;background:var(--panel);margin-bottom:18px;color:var(--muted)}.muted{color:var(--muted);font-size:13px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{font-size:28px;font-weight:750;margin-top:9px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.toolbar h2{margin:0}button,select,input{font:inherit}button{cursor:pointer;border-radius:7px;padding:9px 13px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}button.action{background:var(--accent);color:white;border:0}select,input{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px;border-radius:7px;max-width:100%}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}.tablewrap{overflow:auto}.tag{border:1px solid var(--line);border-radius:20px;padding:4px 8px;font-size:12px}.links{display:flex;gap:8px;flex-wrap:wrap}.error{color:#d35050}.group{font-size:11px;opacity:.6;text-transform:uppercase;letter-spacing:.08em;margin:13px 12px 3px}.manual p{line-height:1.55}.manual h3{margin-bottom:5px}@media(max-width:850px){.sidebar{width:140px}.brand{font-size:14px}.top,.content{padding:14px}.metrics{grid-template-columns:repeat(2,1fr)}.fields{grid-template-columns:1fr}}</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">◈ Generic AM<small>Operations · v0.4.0 DEV</small></div><div id="nav"></div></aside><main class="main"><header class="top"><div><h1 id="heading">Dashboard</h1><span class="muted">Local development system · no production authorization</span></div><div class="links"><button id="help">? Page Help</button><select id="theme"><option value="light">Light</option><option value="dark">Dark</option><option value="slate">Slate</option></select></div></header><div class="content"><div class="note">DEVELOPMENT ONLY · Records persist locally in an excluded SQLite file. Use fictional data only. Not validated for AS9100, ISO 13485 or production use.</div><div id="page"></div></div></main></div><script>
'use strict';let spec={},guides={},current='Dashboard';const page=document.getElementById('page'),nav=document.getElementById('nav');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options){let r=await fetch(path,options),v=await r.json();if(!r.ok)throw Error(v.detail||'Request failed');return v}const groups={'Operations':['CRM','Customers','RFQs','Work Orders','Builds','Parts','Shipping'],'Materials & Assets':['Powder Inventory','Powder Transactions','Equipment','Calibration','Suppliers'],'Quality':['Inspections','NCR','CAPA','Documents','Procedures','Audits','Risk Register','Complaints','Change Control','Validation','Management Review'],'People & Training':['Personnel','Training Materials','Training Records']};function setupNav(){let out='<button class="nav" data-name="Dashboard">Dashboard</button>';for(let [g,names] of Object.entries(groups)){out+=`<div class="group">${g}</div>`+names.map(n=>`<button class="nav" data-name="${esc(n)}">${esc(n)}</button>`).join('')}out+='<div class="group">Reference</div>'+['Traceability','Manual','Reports','Audit Events','Settings'].map(n=>`<button class="nav" data-name="${n}">${n}</button>`).join('');nav.innerHTML=out;nav.querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.name))}async function show(n){current=n;document.getElementById('heading').textContent=n;nav.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.name===n));try{if(spec[n])await table(n);else if(n==='Dashboard')await dashboard();else if(n==='Manual')manual();else if(n==='Traceability')trace();else if(n==='Audit Events')await events();else if(n==='Reports')await reports();else page.innerHTML='<div class="card">Use the theme selector above. All data stays on this computer. No real records should be entered.</div>'}catch(e){page.innerHTML=`<div class="card error">${esc(e.message)}</div>`}}async function dashboard(){let names=['RFQs','Work Orders','Builds','NCR','CAPA','Personnel','Training Records','Powder Inventory'],counts=await Promise.all(names.map(n=>api('/api/records/'+encodeURIComponent(n)).then(r=>r.length)));page.innerHTML=`<div class="metrics">${names.map((n,i)=>`<div class="card"><span class="muted">${n}</span><div class="metric">${counts[i]}</div></div>`).join('')}</div><div class="card"><h2>Manufacturing & Quality Workflow</h2><p>RFQ → Work Order → Build → Part → Inspection → Release</p><p>Supplier → Powder Lot → Powder Transaction → Build → Part</p><p>Personnel → Training Material → Training Record</p><p>NCR → CAPA → Effectiveness Review</p><p class="muted">Linked IDs and append-only creation events are available. Formal approval, qualified-operator enforcement, controlled revisions and electronic signatures are NOT implemented.</p></div>`}async function table(n){let rows=await api('/api/records/'+encodeURIComponent(n)),cols=spec[n];page.innerHTML=`<div class="card"><div class="toolbar"><h2>${esc(n)} <span class="tag">${rows.length} records</span></h2><div class="links"><button id="guide">? How to use</button><button class="action" id="new">+ New Record</button></div></div><p class="muted">${esc(guides[n]||'Generic development records. Use numeric IDs to link records.')}</p><div class="tablewrap"><table><thead><tr><th>ID</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr><td>${r.id}</td>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="muted">No records. Add fictional development data to test.</td></tr>`}</tbody></table></div></div><div id="editor"></div>`;document.getElementById('new').onclick=()=>form(n);document.getElementById('guide').onclick=()=>manual(n)}function form(n){let cols=spec[n];document.getElementById('editor').innerHTML=`<div class="card"><h2>New ${esc(n)} Record</h2><p class="muted">Required: ${esc(cols[0])}. For fields ending in ID, use the numeric ID shown in the related module.</p><form id="entry"><div class="fields">${cols.map((c,i)=>`<label>${esc(c)}<input name="f${i}" maxlength="500" ${i===0?'required':''} placeholder="${esc(c)}"></label>`).join('')}</div><p id="msg" class="error"></p><button class="action" type="submit">Save local development record</button> <button type="button" id="cancel">Cancel</button></form></div>`;document.getElementById('cancel').onclick=()=>document.getElementById('editor').innerHTML='';document.getElementById('entry').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),fields={};cols.forEach((c,i)=>fields[c]=fd.get('f'+i)||'');try{await api('/api/records/'+encodeURIComponent(n),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields})});await table(n)}catch(err){document.getElementById('msg').textContent=err.message}}}function manual(selected){let keys=selected?[selected]:Object.keys(spec);page.innerHTML=`<div class="card manual"><h2>${selected?esc(selected)+' — Page Guide':'Built-in Software Manual'}</h2><p>All data is local and for development only. Create related records before entering numeric references. No approval workflow or electronic signature is enforced.</p>${keys.map(k=>`<h3>${esc(k)}</h3><p>${esc(guides[k]||'Create and review generic '+k.toLowerCase()+' records. The first field is required. Enter numeric record IDs for references.')}</p><p class="muted">Fields: ${spec[k].map(esc).join(' · ')}</p>`).join('')}<h3>Quality system disclaimer</h3><p>Procedures and records are examples, not approved instructions. AS9100 and ISO 13485 conformity requires controlled procedures, validated software, qualified personnel, review and objective evidence.</p></div>`}function trace(){page.innerHTML='<div class="card"><h2>Part Genealogy Lookup</h2><p class="muted">Enter the numeric ID from the Parts page to see associated build, powder and quality records.</p><input type="number" id="partId" min="1" placeholder="Part record ID"> <button class="action" id="lookup">Trace Part</button><pre id="traceResult" style="white-space:pre-wrap;overflow:auto"></pre></div>';document.getElementById('lookup').onclick=async()=>{let id=document.getElementById('partId').value;try{let r=await api('/api/trace/part/'+encodeURIComponent(id));document.getElementById('traceResult').textContent=JSON.stringify(r,null,2)}catch(e){document.getElementById('traceResult').textContent=e.message}}}async function events(){let rows=await api('/api/events');page.innerHTML=`<div class="card"><h2>Creation Events</h2><p class="muted">Development-only append-only creation log. Not tamper-evident and not a compliant electronic audit trail.</p><div class="tablewrap"><table><tr><th>ID</th><th>Record</th><th>Module</th><th>Action</th><th>UTC</th></tr>${rows.map(r=>`<tr><td>${r.id}</td><td>${r.record_id}</td><td>${esc(r.module)}</td><td>${esc(r.action)}</td><td>${esc(r.at_utc)}</td></tr>`).join('')}</table></div></div>`}async function reports(){let keys=Object.keys(spec),counts=await Promise.all(keys.map(k=>api('/api/records/'+encodeURIComponent(k)).then(r=>r.length)));page.innerHTML=`<div class="card"><h2>Development Record Counts</h2><div class="tablewrap"><table>${keys.map((k,i)=>`<tr><td>${esc(k)}</td><td>${counts[i]}</td></tr>`).join('')}</table></div></div>`}document.getElementById('help').onclick=()=>spec[current]?manual(current):manual();let theme=document.getElementById('theme');theme.onchange=()=>{document.documentElement.dataset.theme=theme.value;localStorage.setItem('generic-am-theme',theme.value)};theme.value=localStorage.getItem('generic-am-theme')||'light';document.documentElement.dataset.theme=theme.value;api('/api/modules').then(d=>{spec=d.modules;guides=d.guides;setupNav();show('Dashboard')}).catch(e=>page.textContent=e.message);
</script></body></html>
